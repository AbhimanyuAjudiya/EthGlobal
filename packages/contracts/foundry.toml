[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.30"
# The build sandbox cannot reach binaries.soliditylang.org; solc 0.8.30 is pre-seeded in ~/.svm.
# CI sets FOUNDRY_OFFLINE=false so a fresh runner may download the same compiler.
offline = true
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
# read: chain registry, build artefacts (ABI inspection test, T-10), committed ABIs, EIP-3009 vectors.
# write: deploy/addresses.<slug>.json, abi/*.json, fixtures/eip3009/vectors.json.
fs_permissions = [
    { access = "read-write", path = "./deploy" },
    { access = "read-write", path = "./abi" },
    { access = "read", path = "./out" },
    { access = "read", path = "./script" },
    { access = "read-write", path = "../../fixtures/eip3009" },
]
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[fuzz]
runs = 512
# Fixed seed: fuzz/invariant inputs (and therefore `.gas-snapshot`) are reproducible, so `forge snapshot --check` is
# stable in CI. The red team overrides it (`--fuzz-seed`, FOUNDRY_FUZZ_SEED) for wider exploration.
seed = "0x5eed"
# bytecode PUSH constants include the metadata hash, which changes with build flags (slither, --build-info) and would
# change the fuzz dictionary and therefore the snapshot; storage values and source literals still seed the dictionary.
include_push_bytes = false
# source literals are sampled from the *selected* test set, so a --match/--no-match filter would change fuzz inputs
max_fuzz_dictionary_literals = 0

[invariant]
runs = 64
depth = 32

# Lint production code and scripts; tests intentionally cast revert data and buckets.
[lint]
ignore = ["test/**/*.sol"]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

# `forge script … --rpc-url <alias>`; each alias reads its URL from .env (see deploy/chains.json).
[rpc_endpoints]
anvil = "${ANVIL_RPC_URL}"
unichain_sepolia = "${UNICHAIN_SEPOLIA_RPC_URL}"
arc_testnet = "${ARC_TESTNET_RPC_URL}"
zg_galileo = "${ZG_GALILEO_RPC_URL}"
hedera_testnet = "${HEDERA_TESTNET_RPC_URL}"
worldchain_sepolia = "${WORLDCHAIN_SEPOLIA_RPC_URL}"
whitechain_sepolia = "${WHITECHAIN_SEPOLIA_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
