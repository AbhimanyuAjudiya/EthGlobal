packages:
  - apps/*
  - services/*
  - packages/*
  # ops glue (demo seed, e2e harness, print run, schema generation); not published
  - scripts

# Shared dependency versions; packages reference them with "catalog:".
catalog:
  "@arkiv-network/sdk": 1.0.1
  # axe for the web a11y e2e (apps/web/e2e/a11y.spec.ts); resolved with npm --before=2026-10-31
  "@axe-core/playwright": 4.14.0
  "@eslint/compat": 2.1.1
  "@eslint/js": 10.0.1
  "@hashgraph/hedera-agent-kit": 4.2.0
  "@hiero-ledger/sdk": 2.90.1
  "@hono/node-server": 2.1.6
  "@noble/ciphers": 2.4.0
  "@noble/curves": 2.4.0
  "@noble/hashes": 2.4.0
  "@playwright/test": 1.63.0
  # EVM wallet layer (apps/web lib/wagmi.ts): RainbowKit 2.2.11 (2026-05-06) peers wagmi ^2.9, so wagmi stays on 2.x
  # (2.19.5, 2025-11-19); react-query 5.105.3 published 2026-11-02
  "@rainbow-me/rainbowkit": 2.2.11
  "@tailwindcss/turbopack": 4.3.4
  "@tanstack/react-query": 5.105.3
  "@types/node": 22.20.5
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitest/coverage-v8": 5.1.0
  "@worldcoin/idkit": 4.6.0
  "@worldcoin/idkit-core": 4.6.0
  "@x402/core": 2.29.0
  "@x402/evm": 2.29.0
  "@x402/fetch": 2.29.0
  "@x402/hedera": 2.29.0
  "@x402/hono": 2.29.0
  eslint: 10.14.0
  eslint-config-prettier: 10.1.8
  eslint-plugin-import-x: 4.17.1
  eslint-plugin-react: 7.37.5
  eslint-plugin-react-hooks: 7.1.1
  fast-check: 4.10.2
  globals: 17.14.0
  hono: 4.13.16
  jscpd: 5.4.2
  pino: 10.4.0
  pino-pretty: 13.2.0
  prettier: 3.9.10
  react: 19.3.0
  react-dom: 19.3.0
  tailwindcss: 4.3.4
  tsx: 4.23.15
  typescript: 5.9.3
  typescript-eslint: 8.72.1
  # QR encoder for the printed scratch cards (scripts/print-cards.ts); 0.1.3 published 2026-04-03, zero deps, MIT
  uqr: 0.1.3
  viem: 2.57.14
  vitest: 5.1.0
  wagmi: 2.19.5
  zod: 4.6.7

# Supply chain (THREAT-MODEL T-65): never resolve a version published less than 3 days ago (minutes).
minimumReleaseAge: 4320

# Advisories reached only through transitive exact pins (deps-check.sh §2). Both targets were already in the lockfile.
#   ws  GHSA-96hv-2xvq-fx4p, GHSA-58qx-3vcg-4xpx: @hiero-ledger/sdk@2.90.1 → ethers@6.16.0 → ws@8.17.1 (ethers@6.17.0 pins 8.21.0)
#   zod GHSA-mrhx-c7xc-m3w5: apps/video @remotion/cli@4.0.539 → @remotion/studio-protocol → zod@4.5.4 (remotion ≥4.0.540 pins 4.6.7)
overrides:
  "ws@>=8.0.0 <8.21.0": 8.21.0
  "zod@>=4.0.0 <4.6.6": 4.6.7
  # wallet-kit transitives ask for query-core ^5 and would take 5.106.x (< 3 days old); keep it on react-query's own pin
  "@tanstack/query-core": 5.105.3

# Accepted advisories (RT-P-14, founder-approved 2026-11-06): the vulnerable code is not reachable and the patched
# versions are cross-major, so an override would break the SDK that carries them.
#   GHSA-mrhx-c7xc-m3w5 zod@3.25.76 under wagmi > @wagmi/connectors > @base-org/account > @coinbase/cdp-sdk — the web
#     build aliases @base-org/account to a throwing stub (apps/web/next.config.ts), so cdp-sdk never ships.
#     Re-check when wagmi ships a @base-org/account on zod 4.
#   GHSA-qr28-fpjm-wq7f decode-uri-component@0.2.2 under @walletconnect/utils > query-string@7 — parses only the pairing
#     URI the app itself produces; 0.5.x is ESM-only and query-string 7 require()s it (breaks WalletConnect).
#     Re-check when @walletconnect/utils moves to query-string 9.
auditConfig:
  ignoreGhsas:
    - GHSA-mrhx-c7xc-m3w5
    - GHSA-qr28-fpjm-wq7f

# Install scripts: esbuild's postinstall only verifies its binary; sharp/unrs-resolver are skipped as
# create-next-app does by default.
onlyBuiltDependencies:
  - esbuild
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

# eslint-plugin-react 7.37 declares eslint ^9.7 but runs on ESLint 10 (eslint-config-next ships the same pair).
peerDependencyRules:
  allowedVersions:
    "eslint-plugin-react>eslint": "10"
